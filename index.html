    <!-- Elite Typography: Montserrat (Thick/Bold), Space Grotesk (Tech Body), JetBrains (Code/HUD) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root { --amber: #FF4400; --bg: #030303; }
        
        body, html { 
            background-color: var(--bg); color: #fff; 
            font-family: 'Space Grotesk', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* TYPOGRAPHY CLASSES */
        .font-logo { font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
        .text-hero { font-size: clamp(3.5rem, 10vw, 10rem); line-height: 0.9; }

        /* THE LIVING BACKGROUND ENGINE */
        #global-bg { position: fixed; inset: 0; z-index: -10; pointer-events: none; background: #000; }
        
        /* 1. Deep Core Glow */
        .core-glow {
            position: absolute; top: -20vh; left: 50%; transform: translateX(-50%); width: 80vw; height: 60vh;
            background: radial-gradient(ellipse at center, rgba(255,68,0,0.12) 0%, transparent 65%);
            filter: blur(60px);
        }

        /* 2. Infinite Moving Tech Grid */
        .tech-grid {
            position: absolute; inset: 0; opacity: 0.15;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 100%);
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); } /* Matches background-size for seamless loop */
        }

        /* 3. Cinematic Film Grain */
        .cinematic-grain {
            position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: screen; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 4. The Neural Canvas */
        #neural-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
            opacity: 0.7; pointer-events: none; mix-blend-mode: screen;
        }

        /* BUTTONS */
        .btn-primary { background: var(--amber); color: #000; border: 1px solid var(--amber); transition: all 0.3s ease; }
        .btn-primary:hover { background: #fff; border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.3); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.03); color: #fff; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .btn-secondary:hover { background: rgba(255,68,0,0.1); border-color: var(--amber); color: var(--amber); transform: translateY(-2px); }
        
        /* ONE-TIME LASER SCAN ON LOAD */
        .scanner-line {
            position: absolute; top: -10px; left: 0; width: 100%; height: 2px;
            background: var(--amber); box-shadow: 0 0 20px 5px rgba(255,68,0,0.6);
            animation: scanOnce 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; opacity: 0; z-index: 50; pointer-events: none;
        }
        @keyframes scanOnce { 0% { top: -10px; opacity: 1; } 90% { top: 100%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        /* LOAD ANIMATION */
        .fade-up { opacity: 0; transform: translateY(30px); animation: fadeUpAnim 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUpAnim { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.2s; } .delay-2 { animation-delay: 0.4s; } .delay-3 { animation-delay: 0.6s; }
    </style>
</head>
<body>

    <!-- SAFE GLOBAL TEXTURES (Living Grid & Glow) -->

        <div class="hidden md:flex items-center gap-8 pointer-events-auto">

    <!-- SECTION 1: HERO -->
    <header class="relative min-h-[100svh] w-full flex flex-col justify-center overflow-hidden border-b border-white/10" id="hero">
        
        <!-- One-Time Boot Laser -->
        <div class="scanner-line"></div>

        <!-- The Interactive Neural Network Canvas -->
        <canvas id="neural-canvas"></canvas>

        <div class="relative z-10 w-full max-w-[95vw] mx-auto px-4 md:px-12 flex flex-col justify-center pt-20">
            
            <div class="mb-6 md:mb-10 fade-up">
                <span class="font-mono text-[10px] text-[#FF4400] font-bold tracking-[0.2em] border border-[#FF4400]/40 bg-[#FF4400]/10 px-4 py-2 rounded shadow-[0_0_15px_rgba(255,68,0,0.2)]">
                    // INTELLIGENCE_INFRASTRUCTURE
                </span>
            </div>
            
            <!-- Flawless Flexbox Spacing for Typography. NO WIREFRAMES. SOLID. -->
            <h2 class="text-hero font-logo font-black text-white m-0 p-0 flex flex-col gap-1 md:gap-2 fade-up delay-1 pointer-events-none">
                <span class="block">WE DON'T</span>
                <span class="block text-gray-300">SCALE WORK.</span>
                <span class="block text-[#FF4400]">WE SCALE MINDS.</span>
            </h2>
            
            <div class="mt-8 md:mt-12 max-w-2xl bg-black/40 backdrop-blur-xl p-6 md:p-8 rounded-xl border border-white/5 border-l-4 border-l-[#FF4400] fade-up delay-2 shadow-2xl pointer-events-none">
                <p class="text-base md:text-xl font-light text-gray-200 leading-relaxed">
                    Strategy, brand, design, and cinema. Orchestrated by <strong class="text-white font-bold tracking-widest uppercase text-sm md:text-base">83 Synthetic Agents.</strong> Directed by absolute human taste.
                </p>
            </div>

            <!-- Double CTAs -->
            <div class="mt-8 md:mt-10 flex flex-col sm:flex-row gap-4 w-full sm:w-auto fade-up delay-3 relative z-20 pointer-events-auto">
                <a href="#command" class="btn-primary px-8 py-5 font-mono text-xs md:text-sm font-bold text-center rounded tracking-widest flex items-center justify-center gap-2 w-full sm:w-auto">
                    DEPLOY TEAM <i class="ri-flashlight-fill text-lg"></i>
                </a>
                <a href="#ecosystem" class="btn-secondary px-8 py-5 font-mono text-xs md:text-sm font-bold text-center rounded tracking-widest flex items-center justify-center gap-2 w-full sm:w-auto">
                    CLIENT FILES <i class="ri-folder-open-line text-lg"></i>
                </a>
            </div>

        </div>
    </header>

    <script>
        // THE NEURAL NETWORK CANVAS ENGINE
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let mouse = { x: -1000, y: -1000 }; // Initialize off-screen

        // Track cursor for desktop
        window.addEventListener('mousemove', (e) => { 
            mouse.x = e.clientX; 
            mouse.y = e.clientY; 
        });

        // Track touch for mobile
        window.addEventListener('touchmove', (e) => { 
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX; 
                mouse.y = e.touches[0].clientY; 
            }
        });

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Intelligent scaling: fewer particles on mobile for 60FPS performance
            const particleCount = width < 768 ? 40 : 90;
            
            for(let i=0; i<particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.8, // Slow, deliberate movement
                    vy: (Math.random() - 0.5) * 0.8,
                    radius: Math.random() * 2 + 0.5,
                    isAmber: Math.random() > 0.85 // 15% chance to be brand amber color
                });
            }
        }

        window.addEventListener('resize', init);

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                
                // Cursor Interaction (Magnetic Repulsion)
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if(distance < 150) {
                    // Push away gently
                    p.vx -= (dx / distance) * 0.05;
                    p.vy -= (dy / distance) * 0.05;
                }
                
                // Friction / Speed limit
                p.vx *= 0.99;
                p.vy *= 0.99;
                
                // Maintain minimum autonomous movement
                if(Math.abs(p.vx) < 0.1) p.vx += (Math.random() - 0.5) * 0.1;
                if(Math.abs(p.vy) < 0.1) p.vy += (Math.random() - 0.5) * 0.1;

                p.x += p.vx;
                p.y += p.vy;
                
                // Screen Wrap
                if(p.x < 0) p.x = width;
                if(p.x > width) p.x = 0;
                if(p.y < 0) p.y = height;
                if(p.y > height) p.y = 0;
                
                // Draw Node
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.isAmber ? 'rgba(255, 68, 0, 0.8)' : 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
                
                // Draw Synaptic Connections
                for(let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx2 = p.x - p2.x;
                    let dy2 = p.y - p2.y;
                    let dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                    
                    if(dist2 < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        // Opacity fades as they get further apart
                        let opacity = (1 - dist2 / 120) * 0.15;
                        ctx.strokeStyle = p.isAmber || p2.isAmber ? `rgba(255, 68, 0, ${opacity * 2})` : `rgba(255, 255, 255, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        
        init();
        animate();
    </script>
</body>
